# 服务器侧的部署示例：镜像由 GitHub Actions 构建推送（GHCR），
# 这里只负责拉取和运行。把服务挂到 NPM 所在的 Docker 网络，
# 然后在 NPM 界面加一条 Proxy Host：域名 -> app:4321。
#
# 网络名 npm_default 是 nginx-proxy-manager 默认 compose 创建的那个，
# 如果安装时改过名，把这里换成实际的。
services:
  app:
    image: ghcr.io/kingstar718/mars-blog:latest
    restart: unless-stopped
    volumes:
      # 数据库 + 图片放宿主机目录：迁移好的 .data 直接放这里，
      # 部署/升级不会清掉数据，备份就是拷这个目录
      - ./data:/app/.data
    networks:
      - npm_default

networks:
  npm_default:
    external: true
