# push 到 main / v2-selfhost（或手动触发）时构建 Docker 镜像并推到 GHCR。
#
# 产物：ghcr.io/<owner>/mars-blog:latest（另带分支和 sha 标签）。
# 服务器侧：docker compose pull && docker compose up -d（见 compose.yaml）。
# 镜像默认私有：服务器拉取前要么把包设为 public，要么用有 read:packages
# 权限的 PAT 登录一次 ghcr.io。
name: docker

on:
  push:
    branches: [main, v2-selfhost]
    paths-ignore: ["backup/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
