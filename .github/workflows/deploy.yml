# v2 自部署：push 到 main 只负责构建并产出 dist 产物。
#
# 部署目标不再是 Cloudflare Workers——上线走自己的服务器（构建产物
# rsync 到服务器 + systemd 跑 node dist/server/entry.mjs + Nginx 反代）。
# 服务器地址和凭据还没定，这里先停在「构建 + 上传产物」这一环，
# 服务器信息补充后再把 rsync 步骤和线上冒烟接进来（scripts/smoke.sh
# 默认打本地 http://localhost:4321，可传线上地址）。
name: deploy

on:
  push:
    branches: [main]
    # backup/ 与文档改动不需要重新部署
    paths-ignore: ["backup/**", "*.md"]
  workflow_dispatch:

# 同一时间只部署一次：连续 push 时后来的排队，避免两个部署互相踩
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型与构建
        run: pnpm build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
